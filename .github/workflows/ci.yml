name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kea
          POSTGRES_PASSWORD: kea_ci
          POSTGRES_DB: kea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kea -d kea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://kea:kea_ci@127.0.0.1:5432/kea_test
      DATABASE_SSL: disable
      APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npm run db:migrate

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  prediction:
    name: Prediction service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/prediction

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/prediction/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check kea_prediction tests

      - name: Train on synthetic data
        run: python -m kea_prediction.train --rows 6000

      - name: Tests
        run: pytest -q

      - name: Evaluate
        run: python -m kea_prediction.evaluate --rows 2000

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kea
          POSTGRES_PASSWORD: kea_ci
          POSTGRES_DB: kea_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kea -d kea_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://kea:kea_ci@127.0.0.1:5432/kea_e2e
      DATABASE_SSL: disable
      APP_URL: http://127.0.0.1:3000
      SESSION_COOKIE_NAME: kea_session

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a password for the run
        run: echo "KEA_DEMO_PASSWORD=$(node -e "console.log(require('crypto').randomBytes(18).toString('base64url'))")" >> "$GITHUB_ENV"

      - name: Apply migrations and seed the demonstration data
        run: |
          npm run db:migrate
          npm run seed:reference
          npm run seed:demo

      - name: Build
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run end to end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
