[project]
name = "kea-prediction"
version = "0.1.0"
description = "Experimental referral non-attendance prediction service for Kea"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import order
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "RUF",  # ruff specific
]
ignore = [
  "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
